name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    name: Build, typecheck & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build SDK
        run: |
          bun run --filter '@altananetwork/sdk' build
          bun run --filter '@altananetwork/x402-server' build

      - name: Typecheck shipping packages
        run: |
          bun run --filter '@altananetwork/sdk' \
                  --filter '@altananetwork/mcp' \
                  --filter '@altananetwork/hypersigner-keystore-mcp' \
                  --filter '@altananetwork/x402-server' \
                  typecheck

      - name: Typecheck e2e (fork + demo harness)
        run: bun run --filter '@altananetwork/e2e' typecheck

      - name: Unit tests
        run: |
          cd packages/wallet
          T=src/x402.typeddata.test.ts
          B=src/x402.b402.test.ts
          S=src/sessionKeyRegistration.test.ts
          A=src/approveSignatureChecker.test.ts
          X=src/x402.sign.test.ts
          C=src/client.balances.test.ts
          combo() {
            label="$1"; shift
            code=0
            timeout 45 bun test "$@" >/tmp/c.log 2>&1 || code=$?
            summary=$(grep -E "Ran [0-9]+ tests" /tmp/c.log | tail -1)
            echo "COMBO [$label] exit=$code $summary"
            if [ $code -ne 0 ]; then tail -5 /tmp/c.log; fi
          }
          combo "all6 control"    $T $B $S $A $X $C
          combo "drop typeddata"  $B $S $A $X $C
          combo "drop b402"       $T $S $A $X $C
          combo "drop sessionreg" $T $B $A $X $C
          combo "drop approve"    $T $B $S $X $C
          combo "drop sign"       $T $B $S $A $C
          combo "pair sign+bal"   $X $C
          combo "pair b402+bal"   $B $C
          combo "full glob"       src/*.test.ts src/internal/*.test.ts
          echo "=== bisect done ==="

  fork-tests:
    name: On-chain fork tests (anvil)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Fork tests fork BNB + Base. They read dedicated RPC endpoints from the
    # BSC_FORK_RPC_URL / BASE_FORK_RPC_URL secrets (falling back to public nodes
    # only for local runs without them). With dedicated RPCs they run reliably,
    # so this is now a required gate rather than informational.
    continue-on-error: false
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Setup Foundry (anvil)
        uses: foundry-rs/foundry-toolchain@v1 # TODO: pin to a SHA for supply-chain consistency

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build SDK
        run: |
          bun run --filter '@altananetwork/sdk' build
          bun run --filter '@altananetwork/x402-server' build

      - name: Run fork tests (ERC-1271, permit2, permit2-witness, eip3009)
        env:
          BSC_FORK_RPC_URL: ${{ secrets.BSC_FORK_RPC_URL }}
          BASE_FORK_RPC_URL: ${{ secrets.BASE_FORK_RPC_URL }}
        run: bun run --filter '@altananetwork/e2e' fork:all
